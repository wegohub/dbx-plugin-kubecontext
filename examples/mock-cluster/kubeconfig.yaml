apiVersion: v1
kind: Config
current-context: mock-prod
clusters:
  - name: mock-cluster
    cluster:
      server: http://127.0.0.1:18080
contexts:
  - name: mock-prod
    context:
      cluster: mock-cluster
      user: mock-user
      namespace: default
  - name: mock-staging
    context:
      cluster: mock-cluster
      user: mock-user
      namespace: kube-system
users:
  - name: mock-user
    user:
      token: mock-token
